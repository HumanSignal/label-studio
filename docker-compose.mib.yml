volumes:
  label-studio-data:
    driver: local

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: gavinlouuu/label-studio-custom:${IMAGE_TAG:-latest}
    container_name: label-studio-nginx
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    env_file:
      - .mib.env
    environment:
      - APP_HOST=app
    volumes:
      - label-studio-data:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
    command: nginx
    networks:
      - label-studio-network

  app:
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
    image: gavinlouuu/label-studio-custom:${IMAGE_TAG:-latest}
    container_name: label-studio-app
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - .mib.env
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-1}
      - JSON_LOG=1
      - LOG_LEVEL=ERROR
      # Cloudflare Turnstile
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
      # Base Data Directory (inside container)
      - BASE_DATA_DIR=/label-studio/data
    volumes:
      - label-studio-data:/label-studio/data:rw
    command: label-studio-uwsgi
    networks:
      - label-studio-network

  rqworker:
    image: gavinlouuu/label-studio-custom:${IMAGE_TAG:-latest}
    container_name: label-studio-rqworker
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .mib.env
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_DATA_DIR=/label-studio/data
    volumes:
      - label-studio-data:/label-studio/data:rw
    command: python3 /label-studio/label_studio/manage.py rqworker default
    networks:
      - label-studio-network

  redis:
    image: redis:7-alpine
    container_name: label-studio-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - label-studio-network

  db:
    image: pgautoupgrade/pgautoupgrade:13-alpine
    container_name: label-studio-db
    hostname: db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
      - ./deploy/pgsql/certs:/var/lib/postgresql/certs:ro
    networks:
      - label-studio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflare/config.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/cloudflare/credentials.json:/etc/cloudflared/credentials.json:ro
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=quic
    networks:
      - label-studio-network

networks:
  label-studio-network:
    name: label-studio-network
    driver: bridge
