name: loading-mode-local-agent

services:
  agent-gateway:
    build:
      context: ./tools/local-agent-gateway
    image: loading-mode/local-agent-gateway:dev
    container_name: loading-mode-agent-gateway
    restart: unless-stopped
    ports:
      - "${AGENT_GATEWAY_PORT:-8091}:8090"
    environment:
      - AGENT_GATEWAY_BEARER_TOKEN=${AGENT_GATEWAY_BEARER_TOKEN:-dev-token}
      - AGENT_DEFAULT_APP_URL=${AGENT_DEFAULT_APP_URL:-http://host.docker.internal:8082}
      - AGENT_ALLOWED_HOSTS=${AGENT_ALLOWED_HOSTS:-host.docker.internal,localhost,127.0.0.1,label-studio-nginx-dev}
      - AGENT_HEADLESS=${AGENT_HEADLESS:-true}
      - AGENT_RECORDING_DIR=/recordings
    volumes:
      - ./tmp/agent-recordings:/recordings:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
