name: biowork-dev

# DEVELOPMENT ENVIRONMENT
# - Ports: 8082 (main), 8083 (secondary)
# - Data: ./postgres-data-dev/
# - Containers: label-studio-dev-*

volumes:
  label-studio-data-dev:
    driver: local
  label-studio-tailscale-proxy-dev:
    driver: local

services:
  nginx-dev:
    build:
      context: .
      dockerfile: Dockerfile.development
      args:
        - INCLUDE_DEV=true
    image: gavinlouuu/label-studio-custom:dev
    container_name: label-studio-nginx-dev
    restart: unless-stopped
    ports:
      - "8082:8085"
      - "8083:8086"
    depends_on:
      - app-dev
    environment:
      - APP_HOST=app-dev
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://localhost:8082}
    volumes:
      - label-studio-data-dev:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
    command: nginx
    networks:
      - label-studio-dev-network

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.development
      args:
        - INCLUDE_DEV=true
    image: gavinlouuu/label-studio-custom:dev
    container_name: label-studio-app-dev
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db-dev
      - redis-dev
    env_file:
      - .env
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db-dev
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-1}
      - JSON_LOG=1
      - LOG_LEVEL=DEBUG
      - BILLING_ENFORCE_USAGE_LIMITS=${BILLING_ENFORCE_USAGE_LIMITS:-false}
      - BASE_DATA_DIR=/label-studio/data
      - HTTP_PROXY=http://tailscale-proxy:1055
      - HTTPS_PROXY=http://tailscale-proxy:1055
      - ALL_PROXY=socks5://tailscale-proxy:1055
      - NO_PROXY=localhost,127.0.0.1,db-dev,redis-dev,label-studio-nginx-dev,app-dev,sam2-backend,fastsam-backend,yolo-backend,tailscale-proxy
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws_credentials
      - AWS_CONFIG_FILE=/run/secrets/aws_config
      - AWS_PROFILE=default
      - HDF5_IMPORT_DERIVED_PREFIX=${HDF5_IMPORT_DERIVED_PREFIX:-derived/h5-preview}
      - HDF5_IMPORT_MAX_FRAMES_PER_DATASET=${HDF5_IMPORT_MAX_FRAMES_PER_DATASET:-100}
      - HDF5_IMPORT_MAX_TASKS_PER_FILE=${HDF5_IMPORT_MAX_TASKS_PER_FILE:-100}
    volumes:
      - label-studio-data-dev:/label-studio/data:rw
    secrets:
      - aws_credentials
      - aws_config
    command: label-studio-uwsgi
    networks:
      - label-studio-dev-network

  tailscale-proxy-dev:
    image: tailscale/tailscale:latest
    container_name: label-studio-tailscale-proxy-dev
    hostname: biowork-dev-proxy
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SOCKS5_SERVER=:1055
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=:1055
    volumes:
      - label-studio-tailscale-proxy-dev:/var/lib/tailscale
    networks:
      label-studio-dev-network:
        aliases:
          - tailscale-proxy

  rqworker-dev:
    image: gavinlouuu/label-studio-custom:dev
    container_name: label-studio-rqworker-dev
    restart: unless-stopped
    depends_on:
      - db-dev
      - redis-dev
    env_file:
      - .env
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db-dev
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - LOG_LEVEL=DEBUG
      - BILLING_ENFORCE_USAGE_LIMITS=${BILLING_ENFORCE_USAGE_LIMITS:-false}
      - BASE_DATA_DIR=/label-studio/data
      - HTTP_PROXY=http://tailscale-proxy:1055
      - HTTPS_PROXY=http://tailscale-proxy:1055
      - ALL_PROXY=socks5://tailscale-proxy:1055
      - NO_PROXY=localhost,127.0.0.1,db-dev,redis-dev,label-studio-nginx-dev,app-dev,sam2-backend,fastsam-backend,yolo-backend,tailscale-proxy
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws_credentials
      - AWS_CONFIG_FILE=/run/secrets/aws_config
      - AWS_PROFILE=default
      - HDF5_IMPORT_DERIVED_PREFIX=${HDF5_IMPORT_DERIVED_PREFIX:-derived/h5-preview}
      - HDF5_IMPORT_MAX_FRAMES_PER_DATASET=${HDF5_IMPORT_MAX_FRAMES_PER_DATASET:-100}
      - HDF5_IMPORT_MAX_TASKS_PER_FILE=${HDF5_IMPORT_MAX_TASKS_PER_FILE:-100}
    volumes:
      - label-studio-data-dev:/label-studio/data:rw
    secrets:
      - aws_credentials
      - aws_config
    command: python3 /label-studio/label_studio/manage.py rqworker default low
    networks:
      - label-studio-dev-network

  redis-dev:
    image: redis:7-alpine
    container_name: label-studio-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - label-studio-dev-network

  db-dev:
    image: pgautoupgrade/pgautoupgrade:13-alpine
    container_name: label-studio-db-dev
    hostname: db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - ./postgres-data-dev:/var/lib/postgresql/data
      - ./deploy/pgsql/certs:/var/lib/postgresql/certs:ro
    networks:
      - label-studio-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  label-studio-dev-network:
    name: label-studio-dev-network
    driver: bridge

secrets:
  aws_credentials:
    file: ./.secrets/aws_credentials
  aws_config:
    file: ./.secrets/aws_config
