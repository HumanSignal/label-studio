---
test_name: simple_export
strict: false
marks:
- usefixtures:
  - django_live_url
stages:
- id: signup
  type: ref
- name: stage
  request:
    headers:
      content-type: application/json
    json:
      label_config: <View><Text name="text" value="$text"/><Choices name="label" toName="text"><Choice
        value="pos"/><Choice value="neg"/></Choices></View>
    method: POST
    url: '{django_live_url}/api/projects'
  response:
    save:
      json:
        pk: id
    status_code: 201
- name: stage
  request:
    files:
      file: tests/test_suites/samples/lines.txt
    headers:
      content-type: multipart/form-data
    method: POST
    url: '{django_live_url}/api/projects/{pk}/import'
  response:
    json:
      annotation_count: 0
      prediction_count: 0
      task_count: 3
    status_code: 201
- name: stage
  request:
    method: GET
    url: '{django_live_url}/api/projects/{pk}/next'
  response:
    save:
      json:
        task_pk: id
    status_code: 200
- name: stage
  request:
    headers:
      content-type: application/json
    json:
      lead_time: 34.56
      result:
      - from_name: label
        to_name: text
        type: choices
        value:
          choices:
          - pos
    method: POST
    url: '{django_live_url}/api/tasks/{task_pk}/annotations'
  response:
    save:
      json:
        annotation_pk: id
    status_code: 201
- name: stage
  request:
    method: GET
    url: '{django_live_url}/api/projects/{pk}/export'
  response:
    status_code: 200
- name: stage
  request:
    method: GET
    url: '{django_live_url}/api/projects/{pk}/export?ids[]={task_pk}'
  response:
    status_code: 200
- name: stage
  request:
    method: GET
    url: '{django_live_url}/api/projects/{pk}/export?ids[]=9999999'
  response:
    status_code: 200


---
test_name: YOLO_export_option_polygons
strict: true
marks:
- usefixtures:
  - django_live_url
stages:
- id: signup
  type: ref
- name: stage
  request:
    headers:
      content-type: application/json
    json:
      label_config: <View><Header value="Select label and click the image to start"/><Image name="image" value="$image" /><PolygonLabels name="label" toName="image" strokeWidth="3" pointSize="small"><Label value="Airplane" background="red"/><Label value="Car" background="blue"/></PolygonLabels></View>
    method: POST
    url: '{django_live_url}/api/projects'
  response:
    save:
      json:
        pk: id
    status_code: 201
- name: stage_export
  request:
    method: GET
    url: '{django_live_url}/api/projects/{pk}/export/formats'
  response:
    json:
      - title: Biowork CSV
        description: ZIP with one CSV per image; rows per annotation with bbox (px) and mean intensities (gray, RGB).
        link: https://labelstud.io/guide/export.html#CSV
        tags:
        - image segmentation
        name: SEG_CSV
      - title: JSON
        description: List of items in raw JSON format stored in one JSON file. Use to export
          both the data and the annotations for a dataset. It's Label Studio Common Format
        link: https://labelstud.io/guide/export.html#JSON
        name: JSON
      - title: CSV
        description: Results are stored as comma-separated values with the column names
          specified by the values of the "from_name" and "to_name" fields.
        link: https://labelstud.io/guide/export.html#CSV
        name: CSV
      - title: YOLO with Images
        description: YOLO format with images downloaded.
        link: https://labelstud.io/guide/export.html#YOLO
        tags:
        - image segmentation
        - object detection
        - keypoints
        name: YOLO_WITH_IMAGES
      - title: Brush labels to PNG
        description: Export your brush labels as PNG images. Each label outputs as one image.
        link: https://labelstud.io/guide/export.html#Brush-labels-to-NumPy-amp-PNG
        tags:
        - image segmentation
        name: BRUSH_TO_PNG
        disabled: true


    status_code: 200


---
test_name: mig_export
strict: false
marks:
- usefixtures:
  - django_live_url
stages:
- id: signup
  type: ref
- name: stage
  request:
    headers:
      content-type: application/json
    json:
      label_config:
        <View>
          <Image name="image" valueList="$images"/>
            <RectangleLabels name="labels" toName="image">
              <Label value="Cat"/>
              <Label value="Dog"/>
            </RectangleLabels>
        </View>
    method: POST
    url: '{django_live_url}/api/projects'
  response:
    save:
      json:
        pk: id
    status_code: 201
- name: stage_export
  request:
    method: GET
    url: '{django_live_url}/api/projects/{pk}/export/formats'
  response:
    strict:
      - json:list_any_order
    json:
      - title: 'JSON'
        description: !anystr
        link: 'https://labelstud.io/guide/export.html#JSON'
        name: 'JSON'
      - title: 'CSV'
        description: !anystr
        link: 'https://labelstud.io/guide/export.html#CSV'
        name: 'CSV'
      - title: 'Brush labels to PNG'
        description: !anystr
        link: 'https://labelstud.io/guide/export.html#Brush-labels-to-NumPy-amp-PNG'
        tags: ['image segmentation']
        name: 'BRUSH_TO_PNG'
        disabled: true
    status_code: 200
