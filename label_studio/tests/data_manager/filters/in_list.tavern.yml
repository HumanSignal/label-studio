---
test_name: in-list-data-field-number
strict: false
marks:
  - usefixtures:
      - django_live_url
stages:

  - id: signup
    type: ref

  - id: create_project
    type: ref

  - name: create_filter_tasks
    request:
      files:
        json_file: label_studio/tests/data_manager/filters/int_tasks.json
      headers:
        content-type: multipart/form-data
      method: POST
      url: '{django_live_url}/api/projects/{project_pk}/import'
    response:
      json:
        annotation_count: 0
        prediction_count: 1
        task_count: 6
      status_code: 201

  - name: setup_view_in_list
    request:
      method: POST
      url: '{django_live_url}/api/dm/views/?project={project_pk}'
      json: {
        "data": {
          "columnsDisplayType": {
            "tasks:data.int_field": "Number"
          },
          "filters": {
            "conjunction": "and",
            "items": [
            {
              "filter": "filter:tasks:data.int_field",
              "operator": "in_list",
              "type": "Number",
              "value": [20, 30]
            }
            ]
          },
          "ordering": [
            "tasks:data.int_field"
          ]
        },
        "project": "{project_pk}"
      }
    response:
      save:
        json:
          view: "@"
      status_code: 201

  - name: get_tasks_in_list
    request:
      method: GET
      url: '{django_live_url}/api/tasks?fields=all&view={view.id}'
    response:
      json: {
        "total": 2
      }
      status_code: 200


---
test_name: in-list-data-field-not-in-list
strict: false
marks:
  - usefixtures:
      - django_live_url
stages:

  - id: signup
    type: ref

  - id: create_project
    type: ref

  - name: create_filter_tasks
    request:
      files:
        json_file: label_studio/tests/data_manager/filters/int_tasks.json
      headers:
        content-type: multipart/form-data
      method: POST
      url: '{django_live_url}/api/projects/{project_pk}/import'
    response:
      json:
        annotation_count: 0
        prediction_count: 1
        task_count: 6
      status_code: 201

  - name: setup_view_not_in_list
    request:
      method: POST
      url: '{django_live_url}/api/dm/views/?project={project_pk}'
      json: {
        "data": {
          "columnsDisplayType": {
            "tasks:data.int_field": "Number"
          },
          "filters": {
            "conjunction": "and",
            "items": [
            {
              "filter": "filter:tasks:data.int_field",
              "operator": "not_in_list",
              "type": "Number",
              "value": [20, 30]
            }
            ]
          },
          "ordering": [
            "tasks:data.int_field"
          ]
        },
        "project": "{project_pk}"
      }
    response:
      save:
        json:
          view: "@"
      status_code: 201

  - name: get_tasks_not_in_list
    # 6 tasks: int_field ∈ {1, 20, 30, 40, "50", missing}. NOT IN (20, 30) excludes
    # those two AND the missing/NULL row (standard Postgres NOT IN NULL semantics) → 3.
    request:
      method: GET
      url: '{django_live_url}/api/tasks?fields=all&view={view.id}'
    response:
      json: {
        "total": 3
      }
      status_code: 200


